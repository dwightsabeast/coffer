# Publishes the plugin to the EmDash registry (phase 09). Generated by `emdash-plugin release setup` (plugin-cli
# 0.13.6, Wyatt, 2026-11-24; answers: For every release, Require provenance), then hardened to ci.yml's rules
# (decisions, "CI hardening" and the release 1.0.0 rulings):
# - Fires only on a coffer@X.Y.Z tag. The generated "*@*" also matched xmr-bridge@*, which is bridge-release.yml's.
#   No manual dispatch: a release always comes from a pushed tag.
# - The OIDC and attestation permissions are on the publish job only; the token is otherwise read-only.
# - pnpm from Node's corepack at plugin/package.json's packageManager (no third-party setup action), no dependency
#   cache, frozen lockfile. The CLI runs from plugin/'s lockfile (pnpm exec), never `pnpm dlx`.
# - The same checks as CI's plugin job run on the tagged commit before anything is prepared.
# - Every action is pinned to a full commit SHA, nested ones included (checked at their source, 2026-11-24):
#   actions/checkout 3d3c42e5 (v7.0.1) and actions/setup-node 82076278 (v7.0.0), as in ci.yml;
#   actions/attest-build-provenance 977bb373 (v3.0.0, composite), which calls
#     actions/attest-build-provenance/predicate 864457a5 (predicate@2.0.0, node24, no uses:) and
#     actions/attest daf44fb9 (v3.0.0, node24, no uses:);
#   emdash-cms/emdash/apps/release-action 4a38041a (the last commit to touch it, 2026-11-06; node24, no uses:).
name: "Publish EmDash plugins"

on:
  push:
    tags:
      - "coffer@*"

permissions:
  contents: read

concurrency:
  group: emdash-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: "Build and publish plugin"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # The audience-bound GitHub OIDC token for the release service.
      attestations: write # Signs the bundle's build provenance.
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: "Check repository visibility"
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "::error title=Public repository required::EmDash releases currently require a public GitHub repository because private and internal repository attestations cannot yet be verified."
          exit 1

      - name: "Check the tag is coffer@X.Y.Z"
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$TAG" | grep -Eqx 'coffer@[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::tag $TAG isn't coffer@X.Y.Z"; exit 1; }

      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: "Enable pnpm (corepack, version from package.json)"
        working-directory: plugin
        run: corepack enable pnpm && pnpm --version

      - name: "Install (frozen lockfile; pnpm-workspace.yaml's install-script allowlist and release-age rule apply)"
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: "Checks, as in CI: audit, typecheck, validate, tests (both configs), bundle caps"
        working-directory: plugin
        run: |
          pnpm audit --prod --audit-level high
          pnpm run typecheck
          pnpm exec emdash-plugin validate
          pnpm exec vitest run
          pnpm exec vitest run --config vitest.goods.config.ts
          pnpm exec emdash-plugin bundle --validate-only

      - name: "Prepare plugin release"
        id: prepare
        working-directory: plugin
        shell: bash
        env:
          EMDASH_RELEASE_SELECTOR: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pnpm exec emdash-plugin release prepare "${EMDASH_RELEASE_SELECTOR}" --out-dir .emdash-release

      - name: "Record the bundle's SHA-256"
        env:
          BUNDLE: ${{ steps.prepare.outputs.bundle-file }}
        run: |
          {
            echo "### coffer bundle"
            echo '```'
            sha256sum "$BUNDLE"
            tar -xzOf "$BUNDLE" --wildcards '*backend.js' | sha256sum | sed 's/-$/backend.js/'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: "Create build provenance"
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.prepare.outputs.bundle-file }}

      - name: "Publish plugin"
        uses: emdash-cms/emdash/apps/release-action@4a38041a9c8ad8c00387bade212225ab0d17a183 # main, 2026-11-06
        with:
          service-url: https://releases.emdashcms.com
          publisher-did: ${{ steps.prepare.outputs.publisher-did }}
          bundle-file: ${{ steps.prepare.outputs.bundle-file }}
          plugin-directory: ${{ steps.prepare.outputs.plugin-directory }}
          provenance-file: ${{ steps.attest.outputs.bundle-path }}
