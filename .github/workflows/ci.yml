# Plugin checks on every push to main and every pull request: typecheck, manifest validation, tests, bundle caps.
# Bridge checks (2026-10-04): gofmt, vet, tests, tests with the race detector, a static build. Go from actions/setup-go (GitHub's own), cache off;
# GOTOOLCHAIN=local so Go never fetches another toolchain.
# Reproducibility (T37, phase 09): the release build of the pushed commit at 0.0.0-repro, its SHA-256s as notices.
# Theme checks (2026-10-16, phase 06): typecheck and tests, including the QR round trip through ZBar's zbarimg (zbar-tools
# from the runner's signed Ubuntu archive; never shipped, CI only). COFFER_REQUIRE_ZBAR=1 makes a missing zbarimg fail.
# Dependency scans (T28; Wyatt, 2026-10-31): govulncheck v1.9.0 on bridge/ in source mode, and
# pnpm audit --prod --audit-level high in plugin/ and theme/. The dev trees are not gated.
# Hardening (Wyatt, 2026-10-03): read-only token, no pull_request_target, no persisted git credentials, frozen
# lockfile, no dependency cache. Actions are GitHub's own, pinned to commit SHAs; pnpm comes from Node's corepack
# at the exact version in plugin/package.json ("packageManager"), so there is no third-party setup action.
# Script tests (2026-11-25, Wyatt): node --test on scripts/*.test.mjs and scripts/redteam/*.test.mjs, Node built-ins only;
# the runner image's git, curl, wget, openssl and sha256sum. They need no dev-box state (checked with an empty HOME).
# Test results (2026-11-25, Wyatt): each job saves its suites' results (scripts/report/, the plugin and theme through
# vitest's reporter API, the bridge as go test -json) and the commit and run, as a 30-day artifact
# test-results-<job>, for scripts/security-report-results.mjs. For a release, use the run on the push to main: a pull
# request's run tests GitHub's merge commit (run.txt names both). upload-artifact is the pin approved for
# bridge-release.yml (2026-11-24). The race-detector run and the T37 build save nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugin
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable pnpm && pnpm --version
      - name: Install (frozen lockfile; pnpm-workspace.yaml's install-script allowlist and release-age rule apply)
        run: pnpm install --frozen-lockfile
      - name: Audit runtime dependencies (T28; fails on a high or critical advisory. There are none shipped today, so this fires when a runtime dependency appears)
        run: pnpm audit --prod --audit-level high
      - name: Typecheck
        run: pnpm run typecheck
      - name: Validate manifest
        run: pnpm exec emdash-plugin validate
      - name: Tests (each result also saved, scripts/report/vitest-reporter.mjs)
        env:
          COFFER_RESULTS_FILE: ${{ runner.temp }}/results/plugin.json
        run: mkdir -p "$RUNNER_TEMP/results" && pnpm exec vitest run --reporter=default --reporter=github-actions --reporter="$GITHUB_WORKSPACE/scripts/report/vitest-reporter.mjs"
      - name: Tests with the release-1 switch on (a copy built with GOODS_ENABLED = true; spec change 22)
        env:
          COFFER_RESULTS_FILE: ${{ runner.temp }}/results/plugin-goods.json
        run: pnpm exec vitest run --config vitest.goods.config.ts --reporter=default --reporter=github-actions --reporter="$GITHUB_WORKSPACE/scripts/report/vitest-reporter.mjs"
      - name: Bundle caps
        run: pnpm exec emdash-plugin bundle --validate-only
      - name: Record which commit and run these results are from
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf 'commit=%s\ncheckout=%s\nevent=%s\nrun=%s\n' "$HEAD_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/results/run.txt"
      - name: Save the test results (for the security report; 30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-plugin
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 30

  theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: theme
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COFFER_REQUIRE_ZBAR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install zbar-tools (the QR decoder for the round-trip test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zbar-tools && zbarimg --version
      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable pnpm && pnpm --version
      - name: Install (frozen lockfile; pnpm-workspace.yaml's install-script allowlist and release-age rule apply)
        run: pnpm install --frozen-lockfile
      - name: Audit runtime dependencies (T28; fails on a high or critical advisory. There are none shipped today, so this fires when a runtime dependency appears)
        run: pnpm audit --prod --audit-level high
      - name: Typecheck
        run: pnpm run typecheck
      - name: Tests (each result also saved, scripts/report/vitest-reporter.mjs)
        env:
          COFFER_RESULTS_FILE: ${{ runner.temp }}/results/theme.json
        run: mkdir -p "$RUNNER_TEMP/results" && pnpm exec vitest run --reporter=default --reporter=github-actions --reporter="$GITHUB_WORKSPACE/scripts/report/vitest-reporter.mjs"
      - name: Record which commit and run these results are from
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf 'commit=%s\ncheckout=%s\nevent=%s\nrun=%s\n' "$HEAD_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/results/run.txt"
      - name: Save the test results (for the security report; 30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-theme
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 30

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: The tools the script tests call (from the runner image; the tests use Node built-ins only)
        run: node --version && git --version && curl --version | head -n 1 && wget --version | head -n 1 && openssl version && sha256sum --version | head -n 1
      - name: Script tests (each result also saved, scripts/report/node-reporter.mjs)
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter="$GITHUB_WORKSPACE/scripts/report/node-reporter.mjs" --test-reporter-destination="$RUNNER_TEMP/results/scripts.json" \
            scripts/*.test.mjs scripts/redteam/*.test.mjs
      - name: Record which commit and run these results are from
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf 'commit=%s\ncheckout=%s\nevent=%s\nrun=%s\n' "$HEAD_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/results/run.txt"
      - name: Save the test results (for the security report; 30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-scripts
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 30

  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The one Go pin (RT-28): bridge/go.mod's go line. The dev box runs the same version for the matching rebuild.
          go-version-file: bridge/go.mod
          cache: false
      - name: Formatting (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests (go test -json saved; scripts/report/go-test-log.py prints what plain go test prints)
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          status=0
          go test -json ./... > "$RUNNER_TEMP/results/bridge.json" || status=$?
          python3 -I "$GITHUB_WORKSPACE/scripts/report/go-test-log.py" "$RUNNER_TEMP/results/bridge.json" || status=1
          exit "$status"
      - name: Tests with the race detector (needs cgo; the runner has gcc)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Static build
        run: go build -trimpath -o "$RUNNER_TEMP/xmr-bridge" ./cmd/xmr-bridge && file "$RUNNER_TEMP/xmr-bridge" | grep -q 'statically linked'
      # T37: the release build of the pushed commit itself (a pull request's checkout is GitHub's merge commit, whose
      # ID and time would be in the binaries), fetched fresh outside the workspace as Wyatt's rebuild does, through the
      # one build script. Each SHA-256 is a notice, read through the public check-run API and matched on the dev box.
      - name: "[T37] Reproducibility build (0.0.0-repro, both CPUs, scripts/release-build.sh)"
        working-directory: ${{ runner.temp }}
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q repro-src
          git -C repro-src fetch -q --depth 1 "https://github.com/$REPO.git" "$COMMIT"
          git -C repro-src checkout -q --detach FETCH_HEAD
          [ "$(git -C repro-src rev-parse HEAD)" = "$COMMIT" ]
          sh repro-src/scripts/release-build.sh 0.0.0-repro "$RUNNER_TEMP/repro"
          for f in "$RUNNER_TEMP"/repro/xmr-bridge-0.0.0-repro-linux-*; do
            echo "::notice title=repro $(basename "$f")::$(sha256sum "$f" | cut -d ' ' -f 1) $COMMIT"
          done
      - name: Install govulncheck v1.9.0 (T28; the Go team's scanner, fetched through sum.golang.org, then checked against the module hash recorded here)
        env:
          GOBIN: ${{ runner.temp }}/gobin
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go version -m "$GOBIN/govulncheck" | grep -F "$(printf 'golang.org/x/vuln\tv1.9.0\th1:12VaqnI9kJfqwRoPptxoqsUhQtdfrSbdksT7X/KY/sc=')"
      - name: govulncheck on the bridge (source mode; exit 3 means a vulnerability the code calls; any other failure means the scan didn't finish, which isn't a pass)
        run: |
          status=0
          "$RUNNER_TEMP/gobin/govulncheck" ./... || status=$?
          case "$status" in
            0) ;;
            3) echo "::error::govulncheck found a vulnerability that the bridge calls"; exit 1 ;;
            *) echo "::error::govulncheck could not finish (exit $status)"; exit 1 ;;
          esac
      - name: Hash-list verifier against gpgv and go-crypto (bridge/oracle, a separate test-only module)
        working-directory: bridge/oracle
        run: gpgv --version | head -1 && test -z "$(gofmt -l .)" && go vet ./... && go test -count=1 -v ./...
      - name: Record which commit and run these results are from
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: printf 'commit=%s\ncheckout=%s\nevent=%s\nrun=%s\n' "$HEAD_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/results/run.txt"
      - name: Save the test results (for the security report; 30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-bridge
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 30
