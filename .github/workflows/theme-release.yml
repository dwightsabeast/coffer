# The theme package's release (phase 09 step 5; Wyatt, 2026-11-25, docs/decisions.md). On a cofferhq-astro@X.Y.Z tag
# only (the plugin's coffer@* tags are emdash-release.yml's, the bridge's xmr-bridge@* bridge-release.yml's), from the
# tagged commit, which must be main's head. It stages @cofferhq/astro on npm through trusted publishing (GitHub's OIDC
# token, no npm token anywhere) with provenance; nothing goes live until Wyatt approves the staged version on npmjs.com
# with 2FA. The trusted publisher on npm names this file, theme-release.yml, and allows only `npm stage publish`.
#
# Two jobs, so that no code from a dependency ever runs where an OIDC token can be had:
# - check: as ci.yml's theme job (frozen install, audit, typecheck, tests with the QR round trip), no id-token;
# - stage: a fresh checkout, no install, no lifecycle scripts; packs the tarball, records its SHA-256 and npm's
#   integrity in the job summary, and stages exactly that file. Only this job has id-token: write.
# Hardening as ci.yml (decisions, "CI hardening", with the 2026-11-24 amendment): read-only token, no persisted git
# credentials, no cache, GitHub's own actions only, pinned to full SHAs (the same pins as ci.yml; neither calls another
# action).
name: "Theme package release"

on:
  push:
    tags:
      - "cofferhq-astro@*"

permissions:
  contents: read

concurrency:
  group: theme-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: "Check @cofferhq/astro"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: theme
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COFFER_REQUIRE_ZBAR: "1"
    steps:
      - name: "Check the tag is cofferhq-astro@X.Y.Z"
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$TAG" | grep -Eqx 'cofferhq-astro@[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::tag $TAG isn't cofferhq-astro@X.Y.Z"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: "Install zbar-tools (the QR decoder for the round-trip test)"
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zbar-tools && zbarimg --version

      - name: "Enable pnpm (corepack, version from package.json)"
        run: corepack enable pnpm && pnpm --version

      - name: "Install (frozen lockfile; pnpm-workspace.yaml's install-script allowlist and release-age rule apply)"
        run: pnpm install --frozen-lockfile

      - name: "Audit runtime dependencies (T28; fails on a high or critical advisory)"
        run: pnpm audit --prod --audit-level high

      - name: "Typecheck"
        run: pnpm run typecheck

      - name: "Tests (including tests/package.test.ts: the fields and npm pack's exact file list)"
        run: pnpm test

  stage:
    name: "Stage @cofferhq/astro on npm (Wyatt approves with 2FA)"
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm's trusted publishing (and its provenance) through GitHub's OIDC token.
    defaults:
      run:
        working-directory: theme
    steps:
      - name: "Check the tag is cofferhq-astro@X.Y.Z"
        id: tag
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$TAG" | grep -Eqx 'cofferhq-astro@[0-9]+\.[0-9]+\.[0-9]+' || { echo "::error::tag $TAG isn't cofferhq-astro@X.Y.Z"; exit 1; }
          echo "version=${TAG#cofferhq-astro@}" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "The tagged commit is main's head (main is fast-forwarded to the release commit before tagging)"
        working-directory: .
        env:
          REPO: ${{ github.repository }}
        run: |
          head=$(git rev-parse HEAD)
          [ "$head" = "$GITHUB_SHA" ] || { echo "::error::checked out $head, the tag is $GITHUB_SHA"; exit 1; }
          main=$(git ls-remote "https://github.com/$REPO.git" refs/heads/main | cut -f 1)
          [ "$main" = "$head" ] || { echo "::error::main is at $main, the tag at $head: fast-forward main to the release commit first"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: "npm is 11.15.0 or later (staged publishing; trusted publishing needs 11.5.1)"
        run: |
          v=$(npm --version)
          [ "$(printf '11.15.0\n%s\n' "$v" | sort -V | head -n 1)" = "11.15.0" ] || { echo "::error::npm $v is older than 11.15.0"; exit 1; }
          echo "npm $v"

      - name: "package.json is @cofferhq/astro at the tag's version"
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          name=$(node -p 'require("./package.json").name')
          ver=$(node -p 'require("./package.json").version')
          [ "$name" = "@cofferhq/astro" ] || { echo "::error::package.json names $name"; exit 1; }
          [ "$ver" = "$VERSION" ] || { echo "::error::package.json is $ver, the tag $VERSION"; exit 1; }

      - name: "Pack the tarball and record it"
        id: pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json >"$RUNNER_TEMP/pack.json"
          tgz="$RUNNER_TEMP/cofferhq-astro-$VERSION.tgz"
          [ -f "$tgz" ] || { echo "::error::no $tgz"; exit 1; }
          sha=$(sha256sum "$tgz" | cut -d ' ' -f 1)
          integrity=$(node -p 'require(process.argv[1])[0].integrity' "$RUNNER_TEMP/pack.json")
          files=$(node -p 'require(process.argv[1])[0].entryCount' "$RUNNER_TEMP/pack.json")
          echo "tgz=$tgz" >>"$GITHUB_OUTPUT"
          {
            echo "### @cofferhq/astro@$VERSION, staged from $GITHUB_SHA"
            echo
            echo "- tarball SHA-256: \`$sha\`"
            echo "- npm integrity: \`$integrity\`"
            echo "- files: $files"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::notice::cofferhq-astro-$VERSION.tgz sha256 $sha, $integrity, $files files"

      - name: "Stage exactly that tarball (trusted publishing; provenance is automatic)"
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: npm stage publish --ignore-scripts "$TGZ"
